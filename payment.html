<!DOCTYPE html>
<html lang="en">
<head>
    <title>Payment - Amanda's Pet Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coustard:wght@400;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="payment-styles.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="imgs/icons8-pet-16.png">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    
    <!-- QR Code removed (not used) -->
    
    <!-- Firebase CDN Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>
    
    <!-- Your custom scripts -->
    <script type="module" src="script.js"></script>
</head>
<body>
    <div id="header-container"></div>
    <div id="nav-container"></div>
    
    <div class="content">
        <h1>Complete Your Payment</h1>
        
        <div class="payment-container">
            <!-- Service Selection with quantities (Pet Introduction removed) -->
            <div class="payment-section">
                <h2>Select Services & Quantities</h2>
                <div class="service-quantity-list">
                    <div class="service-row" data-service-id="house">
                        <div class="service-info">
                            <div class="service-icon">🏠</div>
                            <div>
                                <div class="service-name">House Sitting</div>
                                <div class="service-amount">$50 / night</div>
                            </div>
                        </div>
                        <div class="service-qty">
                            <label for="qty-house">Qty</label>
                            <div class="qty-control">
                                <button class="qty-btn qty-decrease" data-target="qty-house" aria-label="Decrease quantity"></button>
                                <input id="qty-house" class="qty-input" type="number" min="0" value="0" data-price="50">
                                <button class="qty-btn qty-increase" data-target="qty-house" aria-label="Increase quantity"></button>
                            </div>
                        </div>
                    </div>

                    <div class="service-row" data-service-id="dropin">
                        <div class="service-info">
                            <div class="service-icon">🐾</div>
                            <div>
                                <div class="service-name">Drop In Visit</div>
                                <div class="service-amount">$30 / visit</div>
                            </div>
                        </div>
                        <div class="service-qty">
                            <label for="qty-dropin">Qty</label>
                            <div class="qty-control">
                                <button class="qty-btn qty-decrease" data-target="qty-dropin" aria-label="Decrease quantity"></button>
                                <input id="qty-dropin" class="qty-input" type="number" min="0" value="0" data-price="30">
                                <button class="qty-btn qty-increase" data-target="qty-dropin" aria-label="Increase quantity"></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tips (moved up to appear immediately after service selection) -->
            <div class="payment-section">
                <h2>Add a Tip</h2>
                <div class="tip-row">
                    <div class="tip-buttons" id="tip-buttons">
                        <button class="tip-btn" data-tip="5">$5</button>
                        <button class="tip-btn active" data-tip="7">$7</button>
                        <button class="tip-btn" data-tip="15">$15</button>
                        <button class="tip-btn" data-tip="25">$25</button>
                        <button class="tip-btn" data-tip="custom" id="tip-custom-btn">Custom</button>
                    </div>
                    <div class="tip-custom-input" id="tip-custom-input" style="display:none;">
                        <label for="tip-custom-value">Custom amount (USD)</label>
                        <input id="tip-custom-value" type="number" min="0" step="0.01" placeholder="Enter amount">
                    </div>
                </div>
            </div>

            <!-- Payment Details -->
            <div class="payment-section">
                <h2>Payment Information</h2>
                <div class="payment-details-card">
                    <div class="payment-row">
                        <span class="payment-label">Items:</span>
                        <span class="payment-value" id="selected-service">House Sitting</span>
                    </div>
                    <div class="payment-row">
                        <span class="payment-label">Subtotal:</span>
                        <span class="payment-value" id="payment-subtotal">$50.00</span>
                    </div>
                    <div class="payment-row">
                        <span class="payment-label">Tip:</span>
                        <span class="payment-value" id="payment-tip">$7.00</span>
                    </div>
                    <div class="payment-row total-row">
                        <span class="payment-label">Total:</span>
                        <span class="payment-value" id="payment-total">$57.00</span>
                    </div>
                </div>
            </div>

            <!-- Payment Methods (multiple providers) -->
            <div class="payment-section">
                <h2>Choose a Payment Option</h2>
                <div class="payment-providers" id="payment-providers">
                    <!-- Buttons generated by JS using the providers config -->
                </div>
            </div>

            

            <!-- Provider Payment Display removed per user request -->
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="payment-script.js"></script>
</body>
</html>
